name: 同花顺发帖监控

on:
  schedule:
    # GitHub 的定时任务是 UTC 时间，*/10 = 每 5 分钟一次（实际可能延迟 5~15 分钟，属正常）
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: '只发一条测试推送到手机（验证 Bark 是否配好）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ths-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 恢复已读记录
        uses: actions/cache@v4
        with:
          path: state.json
          key: ths-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ths-state-

      - name: 准备 Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 检查新帖
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TEST_MODE: ${{ inputs.test }}
        run: |
          set -e
          CHROME_BIN="${CHROME_PATH:-}"
          if [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          fi
          if [ -z "$CHROME_BIN" ]; then echo "没有可用的 Chrome"; exit 1; fi
          echo "Chrome: $CHROME_BIN"
          echo "Bark 配置长度: ${#BARK_URL}"
          export CHROME_PATH="$CHROME_BIN"
          if [ "$TEST_MODE" = "true" ]; then
            node scripts/ths-watch-ci.js --test
          else
            node scripts/ths-watch-ci.js
          fi
