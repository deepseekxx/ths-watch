name: 同花顺发帖监控

# 说明：
# - 主链路是「长驻接力」：一次运行 5 小时，每 5 分钟检查一轮，快结束时自动派发下一次运行，
#   这样不依赖 GitHub 那个出了名不靠谱的定时器。
# - 下面的 schedule 只是兜底看门狗：万一接力断了，最多 15 分钟内会被它拉起来。
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: '只发一条测试推送到手机'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # 允许自己派发下一次运行（接力）

concurrency:
  group: ths-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 恢复已读记录
        uses: actions/cache@v4
        with:
          path: state.json
          key: ths-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ths-state-

      - name: 准备 Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 持续检查
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TEST_MODE: ${{ inputs.test }}
          CHECK_INTERVAL_SECONDS: '300'
          MAX_RUNTIME_MINUTES: '290'
          LOOP_MODE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CHROME_BIN="${CHROME_PATH:-}"
          if [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          fi
          if [ -z "$CHROME_BIN" ]; then echo "没有可用的 Chrome"; exit 1; fi
          echo "Chrome: $CHROME_BIN"
          export CHROME_PATH="$CHROME_BIN"
          if [ "$TEST_MODE" = "true" ]; then
            node scripts/ths-watch-ci.js --test
          else
            node scripts/ths-watch-ci.js
          fi
